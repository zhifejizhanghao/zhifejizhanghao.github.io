<!doctype html>
<html lang="{{ site.lang | default: 'zh-Hant' }}">
  <head>
    <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><link rel="icon" type="image/x-icon" href="{{ '/favicon.ico' | relative_url }}"><link rel="icon" type="image/svg+xml" href="{{ '/assets/images/favicon.svg' | relative_url }}"><link rel="apple-touch-icon" href="{{ '/apple-touch-icon.png' | relative_url }}"><meta name="description" content="{{ page.description | default: site.description | escape }}"><meta name="keywords" content="{{ page.keywords | default: site.keywords | escape }}"><link rel="canonical" href="{{ page.url | absolute_url }}"><link rel="stylesheet" href="{{ '/assets/css/site.css' | relative_url }}"><title>{% if page.title %}{{ page.title }}{% else %}{{ site.title }}{% endif %}</title>
  </head>
  <body>
    <div class="page-shell">
      {% include header.html %}
      <main class="main-shell">
        {{ content }}
      </main>
      {% include footer.html %}
    </div>
    <div class="toast" data-toast aria-live="polite">
    </div>
    <script src="{{ '/assets/js/share.js' | relative_url }}"></script>
  
</body>
</html>

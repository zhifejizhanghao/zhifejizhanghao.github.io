name: IndexNow URL Submission

on:
  push:
    paths:
      - "_posts/**"
      - "*.md"
  workflow_dispatch:

jobs:
  indexnow:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Submit URLs to IndexNow
        env:
          INDEXNOW_KEY: 4a38f28dc5714ebea70c452cdd7003d6
          BASE_URL: https://zhifejizhanghao.github.io
        run: |
          echo "Collecting article URLs from sitemap.xml..."

          # Fetch sitemap and extract article URLs
          URLs=$(curl -s "$BASE_URL/sitemap.xml" | grep -oP 'https://[^<]+' | grep '/articles/' | head -50)

          if [ -z "$URLS" ]; then
            echo "No article URLs found. Exiting."
            exit 0
          fi

          URL_COUNT=$(echo "$URLS" | wc -l)
          echo "Found $URL_COUNT URLs"

          # Build JSON payload
          URLS_JSON=$(echo "$URLS" | python3 -c "
          import sys, json
          urls = [line.strip() for line in sys.stdin if line.strip()]
          print(json.dumps(urls))
          ")

          PAYLOAD=$(cat <<EOF
          {
            "host": "zhifejizhanghao.github.io",
            "key": "$INDEXNOW_KEY",
            "keyLocation": "$BASE_URL/$INDEXNOW_KEY.txt",
            "urlList": $URLS_JSON
          }
          EOF
          )

          echo "Submitting $URL_COUNT URLs to Bing IndexNow..."
          curl -s -X POST             -H "Content-Type: application/json; charset=utf-8"             -d "$PAYLOAD"             "https://api.indexnow.org/indexnow"

          echo ""
          echo "IndexNow submission complete."

